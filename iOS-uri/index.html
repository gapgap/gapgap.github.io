<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="https://cdn.appsflyer.com/af-statics/images/favicon.ico" type="image/x-icon"/>
    <link rel="apple-touch-icon" href="https://cdn.appsflyer.com/af-statics/images/favicon.png" type="image/png"/>
    <link rel="icon" href="https://cdn.appsflyer.com/af-statics/images/favicon.png" type="image/png"/>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta
            name="viewport"
            content="width=device-width,minimum-scale=1.0, maximum-scale=1.0"
    />
    <title>OneLink Simulator</title>
    <style type="text/css">
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Helvetica, Arial, Verdana, sans-serif;
            background-color: #f5f6f8;
        }

        .container {
            min-width: 280px;
            background: white;
            border: 1px solid #e8e8e8;
            border-radius: 4px;
            padding: 30px;
            margin: 20px;
        }

        .app-info {
            display: flex;
            align-items: center;
        }

        .logo {
            margin-right: 15px;
            height: 60px;
        }

        .logo img {
            width: 60px;
            border: 1px solid #e8e8e8;
            border-radius: 4px;
        }

        .placeholder {
            width: 60px;
            height: 60px;
            border: 1px solid #e8e8e8;
            border-radius: 4px;
            background: #e8e8e8;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .placeholder-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #47525d;
        }

        .placeholder-dot + .placeholder-dot {
            margin-left: 5px;
        }

        .app-name {
            font-size: 15px;
            line-height: 18px;
            color: #39434e;
        }

        .button {
            display: block;
            padding: 10px;
            margin-top: 20px;
            font-size: 15px;
            text-align: center;
            text-decoration: none;
            color: white;
            font-weight: bold;
            border-radius: 4px;
            background: #1b71bd;
        }

        .button + .button {
            margin-top: 10px;
        }

        .hide {
            display: none
        }

        .show {
            display: block;
        }

        @media screen and (max-device-width: 480px) {
            body {
                -webkit-text-size-adjust: none;
            }
        }
    </style>
    <script src="bridge.js" defer></script>
</head>
<body>
<main class="container hide" id="container">
    <section class="app-info">
        <div class="logo" id="logo"></div>
        <div>
            <div class="app-name">OneLink Simulator</div>
        </div>
    </section>
    <!--      <a class="button" id="open" href="#" target="_blank"></a>-->
    <div class="button" id="open"></div>
</main>
</body>
</html>
