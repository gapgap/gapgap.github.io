<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting…</title>
</head>
<body>
  <p>Redirecting to the banner test… <a id="destination" href="index.html">Continue</a></p>
  <noscript>Enable JavaScript to redirect automatically and forward all query parameters.</noscript>
  <script>
    const destination = new URL('index.html', window.location.href);
    destination.search = window.location.search;
    destination.hash = window.location.hash;
    document.getElementById('destination').href = destination.href;
    window.location.replace(destination.href);
  </script>
</body>
</html>
