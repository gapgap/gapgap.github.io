<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banner CTA test</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 20px 220px; background: #f5f5f7; color: #202124; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 560px; margin: 48px auto; }
    h1 { font-size: 28px; }
    .banner { position: fixed; bottom: 0; left: 0; right: 0; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); background: white; box-shadow: 0 -4px 24px #00000012; }
    .banner-content { max-width: 560px; margin: auto; }
    .banner h2 { margin: 0 0 4px; font-size: 22px; }
    .banner p { margin: 0 0 16px; color: #60646c; }
    button { width: 100%; padding: 15px 24px; border: 0; border-radius: 8px; background: #df2645; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid #202124; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Banner CTA test</h1>
    <p>Tap “Take me there” in the banner to open the link.</p>
  </main>
  <aside class="banner" aria-labelledby="banner-title">
    <div class="banner-content">
      <h2 id="banner-title">Open the app</h2>
      <p>Continue to your destination.</p>
      <button type="button" data-role="cta" data-qa-id="cta-button" data-af-cta-button="true">Take me there</button>
    </div>
  </aside>
  <script>
    const banner = {
      ctaURL: "https://gabtraining.onelink.me/xfPm/ozmfsuhr"
    };

    // Like the banner SDK, resolve the destination from the banner configuration.
    function _getBannerClickedHandler(config) {
      return function (event) {
        const clickURL = config.ctaURL;
        window.location.href = clickURL;
      };
    }

    function _displayBanner(config) {
      const button = document.querySelector("[data-af-cta-button]");
      button.setAttribute("data-af-cta-url", config.ctaURL);
      button.onclick = _getBannerClickedHandler(config);
    }

    _displayBanner(banner);
  </script>
</body>
</html>
